<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SS Gold Loan – Office Dashboard</title>
<style>
:root{--g:#0A2E27;--g2:#0F3A31;--gold:#D4A94A;--cream:#F7F4EC;--ink:#14201D;--mut:#6B7872;--line:#E4DFD0;--card:#fff;--bg:#F7F4EC;--red:#b3392f;--ok:#1f7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a17;--card:#12251f;--ink:#eee9da;--mut:#9fb0a9;--line:#24403a;--cream:#12251f}}
:root[data-theme="dark"]{--bg:#0b1a17;--card:#12251f;--ink:#eee9da;--mut:#9fb0a9;--line:#24403a;--cream:#12251f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--g);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:17px;letter-spacing:.02em}header b span{color:var(--gold)}header small{display:block;opacity:.7;font-size:11px}
.btn{background:var(--gold);color:#1d1a10;border:0;border-radius:9px;padding:9px 16px;font:600 13.5px inherit;font-family:inherit;cursor:pointer}
.btn.s{background:transparent;color:inherit;border:1px solid var(--line)}.btn.r{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}
main{max-width:1150px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.st small{color:var(--mut);font-size:12px}.st div{font:700 22px inherit;font-family:inherit;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.bar input{flex:1;min-width:180px}.bar select{width:auto}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border:0}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e3f3ea;color:var(--ok)}.tag.c{background:#eee;color:#666}.tag.o{background:#fde7e4;color:var(--red)}
.empty{padding:30px;text-align:center;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}
.ov.on{display:flex}.md{background:var(--card);border-radius:14px;max-width:760px;width:100%;padding:20px}
.md h2{margin:0 0 12px;font-size:18px}.md h3{margin:18px 0 8px;font-size:13px;color:var(--g);text-transform:uppercase;letter-spacing:.06em}
@media (prefers-color-scheme:dark){.md h3{color:var(--gold)}}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.gr label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.f2{grid-column:1/-1}.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#doc{display:none}
.ag{color:#000;background:#fff;padding:6px;font-size:13px}.ag h1{text-align:center;margin:0;font-size:22px}.ag p.c{text-align:center;margin:2px 0 10px;font-weight:600}
.ag table{min-width:0;width:100%;margin-bottom:10px}.ag td,.ag th{border:1px solid #333;padding:5px 8px;white-space:normal;color:#000;text-transform:none;font-size:13px;letter-spacing:0}.ag td:first-child{font-weight:600;width:38%}
.ag h4{margin:10px 0 4px}.sg{display:flex;justify-content:space-between;margin-top:50px}
@media print{body>*:not(#docov){display:none!important}#docov{position:static;background:none;padding:0;display:block!important}#docov .md{box-shadow:none;max-width:none;padding:0;background:#fff}.np{display:none!important}}
</style></head><body>
<header><div><b>SS <span>GOLD LOAN</span> &amp; BUYERS</b><small>Office Dashboard · Sangareddy</small></div><div style="display:flex;gap:8px"><button class="btn" id="new">+ New Agreement</button><button class="btn s" id="out" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Logout</button></div></header>
<main>
<div class="stats" id="stats"></div>
<div class="bar"><input id="q" type="search" placeholder="Search name, mobile, agreement no…" aria-label="Search"><select id="fl" aria-label="Filter"><option value="">All</option><option>Active</option><option>Overdue</option><option>Closed</option></select><button class="btn s" id="csv">Export CSV</button></div>
<div class="tw"><table><thead><tr><th>Agreement</th><th>Date</th><th>Customer</th><th>Mobile</th><th>Net Wt (g)</th><th>Loan ₹</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table><div class="empty" id="em" style="display:none">No agreements yet. Click “New Agreement” to add the first one.</div></div>
<p id="note" style="color:var(--mut);font-size:12px"></p>
</main>

<div class="ov on" id="lov"><form class="md" id="lf" style="max-width:360px;margin-top:12vh"><h2>Staff Login</h2><div class="gr"><div class="f2"><label>Email</label><input id="le" type="email" required autocomplete="username"></div><div class="f2"><label>Password</label><input id="lpw" type="password" required autocomplete="current-password"></div></div><p id="lerr" style="color:var(--red)"></p><div class="ft"><button class="btn" id="lb">Login</button></div></form></div>
<div class="ov" id="fov"><form class="md" id="f" autocomplete="off"><h2>Gold Loan Agreement / Pledge Form</h2>
<div class="gr"><div><label>Agreement No.</label><input id="no" readonly></div><div><label>Date</label><input type="date" id="dt" required></div></div>
<h3>1. Borrower Details</h3><div class="gr">
<div><label>Customer Name *</label><input id="nm" required></div><div><label>Father / Husband Name</label><input id="fa"></div>
<div><label>Mobile No. *</label><input id="mo" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" title="10-digit mobile"></div>
<div><label>Aadhaar / ID Proof No.</label><input id="ad" inputmode="numeric"></div><div><label>PAN No.</label><input id="pn" maxlength="10" style="text-transform:uppercase"></div>
<div class="f2"><label>Residential Address</label><textarea id="adr" rows="2"></textarea></div></div>
<h3>2. Gold Details</h3><div class="gr">
<div><label>Gold Item(s)</label><input id="it"></div><div><label>No. of Items</label><input id="ni" type="number" min="1"></div>
<div><label>Gross Weight (g) *</label><input id="gw" type="number" step="0.01" min="0" required></div><div><label>Stone / Other Deduction (g)</label><input id="sd" type="number" step="0.01" min="0" value="0"></div>
<div><label>Net Gold Weight (g)</label><input id="nw" readonly></div><div><label>Purity (K)</label><select id="pu"><option>24</option><option>22</option><option selected>20</option><option>18</option><option>16</option><option>14</option></select></div>
<div><label>Valuation Rate (₹/gram)</label><input id="vr" type="number" min="0"></div><div><label>Total Gold Valuation (₹)</label><input id="tv" type="number" min="0"></div>
<div class="f2"><label>Gold Item Description</label><textarea id="gd" rows="2"></textarea></div></div>
<h3>3. Loan Details</h3><div class="gr">
<div><label>Loan Amount (₹) *</label><input id="la" type="number" min="0" required></div><div><label>Interest Rate (% per month)</label><input id="ir" type="number" step="0.01" min="0"></div>
<div><label>Loan Period (months)</label><input id="lp" type="number" min="1" value="12"></div><div><label>Processing / Other Charges (₹)</label><input id="pc" type="number" min="0" value="0"></div>
<div><label>Total Amount Payable (₹)</label><input id="tp" type="number" min="0"></div><div><label>Due / Maturity Date</label><input id="du" type="date"></div></div>
<p id="err" style="color:var(--red);margin:10px 0 0"></p>
<div class="ft"><button type="button" class="btn s" id="cx">Cancel</button><button class="btn" id="sv">Save Agreement</button></div></form></div>

<div class="ov" id="docov"><div class="md"><div id="doc" class="ag"></div><div class="ft np"><button class="btn s" id="dc">Close</button><button class="btn" id="pr">Print</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== PASTE YOUR FIREBASE CONFIG HERE (Firebase Console > Project settings > Your apps > Web) ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyBTkzCoNuq73rXM6FpJhSLdzcNQUTBcOcM",authDomain:"ssgoldloan-381f0.firebaseapp.com",databaseURL:"https://ssgoldloan-381f0-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"ssgoldloan-381f0",appId:"1:955302731471:web:e9b91f548d793afb55e1ba"};
</script>
<script>
const $=i=>document.getElementById(i),inr=n=>"₹ "+Math.round(+n||0).toLocaleString("en-IN"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let rows=[],ref=null;
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.split("-").reverse().join("/"):"";
function status(r){if(r.status==="Closed")return"Closed";return r.due&&r.due<today()?"Overdue":"Active"}
function render(){
 rows.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.no.localeCompare(a.no));
 const a=rows.filter(r=>r.status!=="Closed"),sum=a.reduce((s,r)=>s+(+r.loan||0),0),gw=a.reduce((s,r)=>s+(+r.net||0),0),od=rows.filter(r=>status(r)==="Overdue").length;
 $("stats").innerHTML=[["Total agreements",rows.length],["Active loans",a.length],["Loan outstanding",inr(sum)],["Gold held (net g)",gw.toFixed(2)],["Overdue",od]].map(([k,v])=>`<div class="st"><small>${k}</small><div>${v}</div></div>`).join("");
 const q=$("q").value.toLowerCase(),fl=$("fl").value;
 const v=rows.filter(r=>(!fl||status(r)===fl)&&(!q||[r.name,r.mobile,r.no].join(" ").toLowerCase().includes(q)));
 $("em").style.display=rows.length?"none":"block";
 $("tb").innerHTML=v.map(r=>{const s=status(r);return`<tr><td>${esc(r.no)}</td><td>${fd(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.mobile)}</td><td>${(+r.net||0).toFixed(2)}</td><td>${inr(r.loan)}</td><td>${fd(r.due)}</td><td><span class="tag ${s==="Closed"?"c":s==="Overdue"?"o":""}">${s}</span></td><td><button class="btn s sm" data-v="${esc(r.no)}">View</button> <button class="btn s sm" data-t="${esc(r.no)}">${r.status==="Closed"?"Reopen":"Close"}</button> <button class="btn r sm" data-d="${esc(r.no)}">Delete</button></td></tr>`}).join("");
}
const put=r=>ref.child(r.no).set(r),del=no=>ref.child(no).remove();
let started=false;
function start(){
 if(FIREBASE_CONFIG.apiKey==="YOUR_API_KEY"){$("lerr").textContent="Firebase is not configured yet. Paste your config in the file.";return}
 firebase.initializeApp(FIREBASE_CONFIG);const au=firebase.auth();
 au.onAuthStateChanged(u=>{
  $("lov").classList.toggle("on",!u);
  if(u&&!started){started=true;ref=firebase.database().ref("agreements");
   ref.on("value",s=>{rows=Object.values(s.val()||{});render();$("note").textContent="Live: changes sync instantly across all office devices."},e=>{$("note").textContent="Database error: "+e.message})}
  if(!u&&ref){ref.off();ref=null;started=false;rows=[];render()}});
 $("lf").onsubmit=async e=>{e.preventDefault();$("lerr").textContent="";$("lb").disabled=true;
  try{await au.signInWithEmailAndPassword($("le").value.trim(),$("lpw").value)}catch(x){$("lerr").textContent="Login failed: check email / password."}$("lb").disabled=false};
 $("out").onclick=()=>au.signOut();
}
start();
function nextNo(){const y=new Date().getFullYear(),n=rows.filter(r=>r.no.startsWith("SSGL-"+y)).length+1;let no;do{no="SSGL-"+y+"-"+String(n+(no?1:0)).padStart(4,"0")}while(0);let k=n;while(rows.some(r=>r.no==="SSGL-"+y+"-"+String(k).padStart(4,"0")))k++;return"SSGL-"+y+"-"+String(k).padStart(4,"0")}
function calc(e){
 const n=Math.max(0,(+$("gw").value||0)-(+$("sd").value||0));$("nw").value=n?n.toFixed(2):"";
 const id=e&&e.target.id;
 if(["gw","sd","vr"].includes(id)&&$("vr").value)$("tv").value=Math.round(n*$("vr").value);
 if(["la","ir","lp","pc"].includes(id)){const l=+$("la").value||0;$("tp").value=Math.round(l+l*(+$("ir").value||0)/100*(+$("lp").value||0)+(+$("pc").value||0))}
 if(["dt","lp"].includes(id)&&$("dt").value&&$("lp").value){const d=new Date($("dt").value+"T00:00");d.setMonth(d.getMonth()+(+$("lp").value));$("du").value=d.toISOString().slice(0,10)}
}
$("f").addEventListener("input",calc);
$("new").onclick=()=>{$("f").reset();$("no").value=nextNo();$("dt").value=today();$("err").textContent="";calc({target:{id:"lp"}});calc({target:{id:"dt"}});$("fov").classList.add("on");$("nm").focus()};
$("cx").onclick=()=>$("fov").classList.remove("on");
$("f").onsubmit=async e=>{e.preventDefault();
 const g=i=>$(i).value.trim(),r={no:g("no"),date:g("dt"),name:g("nm"),father:g("fa"),mobile:g("mo"),aadhaar:g("ad"),pan:g("pn").toUpperCase(),address:g("adr"),items:g("it"),count:g("ni"),gross:+g("gw")||0,ded:+g("sd")||0,net:+g("nw")||0,purity:g("pu"),rate:+g("vr")||0,valuation:+g("tv")||0,desc:g("gd"),loan:+g("la")||0,interest:+g("ir")||0,period:+g("lp")||0,charges:+g("pc")||0,payable:+g("tp")||0,due:g("du"),status:"Active",created:new Date().toISOString()};
 if(r.pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(r.pan)){$("err").textContent="PAN format looks wrong (e.g. ABCDE1234F).";return}
 $("sv").disabled=true;try{await put(r);$("fov").classList.remove("on");showDoc(r)}catch(x){$("err").textContent="Could not save: "+(x.message||x)}$("sv").disabled=false};
function showDoc(r){const t=(a)=>a.map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("");
 $("doc").innerHTML=`<h1>SS GOLD LOAN &amp; BUYERS</h1><p class="c">GOLD LOAN AGREEMENT / GOLD PLEDGE FORM</p><p style="font-size:12px"><b>Address:</b> Opposite MPDO Office, Jaitra Dental Hospital Back Side, Bypass Road, Sangareddy<br><b>Contact:</b> 7780218009 / 9703608009</p>
 <table>${t([["Agreement No.",r.no],["Date",fd(r.date)]])}</table><h4>1. BORROWER DETAILS</h4><table>${t([["Customer Name",r.name],["Father / Husband Name",r.father],["Mobile No.",r.mobile],["Residential Address",r.address],["Aadhaar / ID Proof No.",r.aadhaar],["PAN No.",r.pan]])}</table>
 <h4>2. GOLD DETAILS</h4><table>${t([["Gold Item(s)",r.items],["No. of Items",r.count],["Gross Weight",r.gross+" grams"],["Stone / Other Deduction",r.ded+" grams"],["Net Gold Weight",(+r.net).toFixed(2)+" grams"],["Purity",r.purity+" K"],["Valuation Rate",inr(r.rate)+" / gram"],["Total Gold Valuation",inr(r.valuation)],["Gold Item Description",r.desc]])}</table>
 <h4>3. LOAN DETAILS</h4><table>${t([["Loan Amount",inr(r.loan)],["Interest Rate",r.interest+" % per month"],["Processing / Other Charges",inr(r.charges)],["Total Amount Payable",inr(r.payable)],["Loan Period",r.period+" months"],["Due / Maturity Date",fd(r.due)]])}</table>
 <h4>4. BORROWER DECLARATION</h4><p>1. I hereby declare that I am the lawful owner / authorized possessor of the gold articles pledged under this agreement.</p><p>2. The gold pledged by me is not stolen, disputed, mortgaged, pledged elsewhere, or subject to any third-party claim, to the best of my knowledge.</p><p>3. The identification documents and information provided by me are true and correct.</p>
 <div class="sg"><span>Borrower Signature</span><span>For SS Gold Loan &amp; Buyers</span></div>`;
 $("doc").style.display="block";$("docov").classList.add("on")}
$("dc").onclick=()=>$("docov").classList.remove("on");$("pr").onclick=()=>window.print();
$("tb").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const no=b.dataset.v||b.dataset.t||b.dataset.d,r=rows.find(x=>x.no===no);if(!r)return;
 if(b.dataset.v)showDoc(r);
 else if(b.dataset.t)await put({...r,status:r.status==="Closed"?"Active":"Closed"});
 else if(confirm("Delete agreement "+no+" permanently?"))await del(no)};
$("q").oninput=$("fl").onchange=render;
$("csv").onclick=async()=>{if(!rows.length)return;const k=Object.keys(rows[0]).filter(x=>x!=="created"),c=[k.join(",")].concat(rows.map(r=>k.map(x=>'"'+String(r[x]??"").replace(/"/g,'""')+'"').join(","))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download="ss-gold-loans-"+today()+".csv";a.click()};
addEventListener("keydown",e=>{if(e.key==="Escape"){$("fov").classList.remove("on");$("docov").classList.remove("on")}});
</script>
</body></html>
